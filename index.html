<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Spiele</title>
<style>
  :root { --text: #f2f2f4; --leise: #8c8e98; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #050506; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; padding: calc(env(safe-area-inset-top) + 34px) 18px calc(env(safe-area-inset-bottom) + 30px);
    background: radial-gradient(120% 60% at 50% 0%, #15161d, #050506 70%); }
  h1 { text-align: center; font-weight: 200; font-size: 30px; letter-spacing: .55em; padding-left: .55em; }
  .linie { width: 160px; height: 1px; margin: 16px auto 30px; background: linear-gradient(90deg, transparent, #fff, transparent); opacity: .5; }
  .gitter { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto; }
  a { display: flex; flex-direction: column; align-items: center; gap: 10px; text-decoration: none; color: var(--text); padding: 14px 8px 16px;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    opacity: 0; transform: translateY(14px); animation: rein .7s cubic-bezier(.2,.9,.2,1) forwards; animation-delay: calc(var(--i) * 60ms); transition: background .2s; }
  a:active { transform: scale(.97); }
  @media (hover: hover) { a:hover { background: rgba(255,255,255,.07); } }
  img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.9); }
  b { font-size: 12px; font-weight: 600; letter-spacing: .2em; text-align: center; }
  @keyframes rein { to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<h1>SPIELE</h1>
<div class="linie"></div>
<div class="gitter" id="g"></div>
<script>
  const SPIELE = [['nim', 'NIM'], ['codebreaker', 'CODEBREAKER'], ['minefield', 'MINEFIELD PRO'], ['wallduel', 'WALL DUEL'], ['towertactics', 'TOWER TACTICS'],
    ['gridwars', 'GRID WARS'], ['numberduel', 'NUMBER DUEL'], ['lineup', 'LINEUP'], ['logicduel', 'LOGIC DUEL'], ['shards', 'SHARDS']];
  // Spiele, die (noch) nicht hochgeladen sind, verschwinden einfach
  document.getElementById('g').innerHTML = SPIELE.map(([id, name], i) => `<a href="${id}/" style="--i:${i}"><img src="${id}/icon-180.png" alt="" onerror="this.parentNode.remove()"><b>${name}</b></a>`).join('');
</script>
</body>
</html>
