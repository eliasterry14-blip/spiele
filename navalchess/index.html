<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Naval Chess">
<meta name="format-detection" content="telephone=no">
<title>NAVAL CHESS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="stil.css">
</head>
<body>
<div id="app">
  <div class="buehne" id="buehne"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- ===================== HAUPTMENÜ ===================== -->
  <section class="seite" id="s-menue">
    <div class="km-titel">
      <h1>Naval Chess</h1>
      <p>Schach auf hoher See</p>
    </div>
    <nav class="km-liste">
      <button class="km-punkt" data-aktion="spielen" style="--i:0"><span>Spielen</span><small id="spielen-info"></small></button>
      <button class="km-punkt" data-aktion="ki-wahl" style="--i:1"><span>Gegen Computer</span></button>
      <button class="km-punkt" data-aktion="zwei-wahl" style="--i:2"><span>Zwei Spieler</span></button>
      <button class="km-punkt" data-aktion="einstellungen" style="--i:3"><span>Einstellungen</span></button>
    </nav>
    <div class="km-version">Version 1.2</div>
  </section>

  <!-- Startbildschirm: Emblem zeichnet sich, dann geht die Laterne an -->
  <div class="intro" id="intro">
    <div class="intro-emblem" aria-hidden="true">
      <svg viewBox="0 0 200 262">
        <defs>
          <linearGradient id="em-silber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#e3ebf0"/><stop offset="1" stop-color="#a9b9c6"/></linearGradient>
        </defs>
        <g class="em-form">
          <circle class="em-ring" cx="100" cy="22" r="14" pathLength="1"/>
          <path class="em-teil" pathLength="1" d="M95 34h10v34H95z"/>
          <path class="em-teil" pathLength="1" d="M83 98V83l8.5 6.5L100 76l8.5 13.5L117 83v15z"/>
          <rect class="em-teil" pathLength="1" x="83" y="99" width="34" height="7" rx="3"/>
          <path class="em-teil" pathLength="1" d="M89 107h22l-4 111c-2 9-12 9-14 0z"/>
          <rect class="em-teil" pathLength="1" x="44" y="66" width="112" height="10" rx="5"/>
          <circle class="em-teil" pathLength="1" cx="44" cy="71" r="8"/>
          <circle class="em-teil" pathLength="1" cx="156" cy="71" r="8"/>
          <path class="em-teil" pathLength="1" d="M100 236C62 236 34 216 26 178l12-2c8 30 30 46 62 46z"/>
          <path class="em-teil" pathLength="1" d="M100 236c38 0 66-20 74-58l-12-2c-8 30-30 46-62 46z"/>
          <path class="em-teil" pathLength="1" d="M10 188l20-42 18 40c-10-8-24-8-38 2z"/>
          <path class="em-teil" pathLength="1" d="M190 188l-20-42-18 40c10-8 24-8 38 2z"/>
          <path class="em-teil" pathLength="1" d="M86 230l14 28 14-28z"/>
        </g>
        <g class="em-funken">
          <path style="--d:.1s" transform="translate(100 22) scale(1.2)" d="M0-5L1.2-1.2 5 0 1.2 1.2 0 5-1.2 1.2-5 0-1.2-1.2z"/>
          <path style="--d:.6s" transform="translate(120 150) scale(1.4)" d="M0-5L1.2-1.2 5 0 1.2 1.2 0 5-1.2 1.2-5 0-1.2-1.2z"/>
          <path style="--d:1.1s" transform="translate(38 196) scale(.9)" d="M0-5L1.2-1.2 5 0 1.2 1.2 0 5-1.2 1.2-5 0-1.2-1.2z"/>
          <path style="--d:.9s" transform="translate(152 70) scale(.8)" d="M0-5L1.2-1.2 5 0 1.2 1.2 0 5-1.2 1.2-5 0-1.2-1.2z"/>
        </g>
      </svg>
    </div>
    <div class="intro-name">Naval Chess</div>
    <div class="intro-tipp" aria-hidden="true"></div>
  </div>

  <!-- ===================== SPIEL EINRICHTEN ===================== -->
  <section class="seite" id="s-wahl">
    <header class="kopf">
      <button class="zurueck" data-aktion="menue" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 id="wahl-titel">Gegen Computer</h2>
    </header>
    <div class="wahl-inhalt">
      <div class="abschnitt" id="wahl-gegner">
        <h3>Gegner</h3>
        <div class="stufen" id="stufen"></div>
      </div>
      <div class="abschnitt">
        <h3>Modus</h3>
        <div class="segment" id="modus-wahl">
          <button data-wert="klassisch"><b>Klassisch</b><small>Normales Schach</small></button>
          <button data-wert="gefecht"><b>Gefecht</b><small>Mit Attacken · 3 Schuss</small></button>
        </div>
      </div>
      <div class="abschnitt" id="wahl-farbe">
        <h3>Deine Flotte</h3>
        <div class="segment farben" id="farb-wahl">
          <button data-wert="w"><span class="fw-schiff" data-farbe="w"></span><b>Weiß</b></button>
          <button data-wert="z"><span class="fw-zufall">?</span><b>Zufall</b></button>
          <button data-wert="b"><span class="fw-schiff" data-farbe="b"></span><b>Schwarz</b></button>
        </div>
      </div>
    </div>
    <div class="fuss"><button class="gross-knopf" data-aktion="los">Leinen los</button></div>
  </section>

  <!-- ===================== EINSTELLUNGEN ===================== -->
  <section class="seite" id="s-einst">
    <header class="kopf">
      <button class="zurueck" data-aktion="einst-zurueck" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2>Einstellungen</h2>
    </header>
    <div class="einst-inhalt" id="einst-inhalt"></div>
  </section>

  <!-- ===================== SPIEL ===================== -->
  <section class="seite" id="s-spiel">
    <div class="ruf" id="ruf"></div>
    <header class="spiel-kopf">
      <div class="marke"><svg viewBox="0 0 24 24"><path d="M12 3v15m-7-5a7 7 0 0 0 14 0M8 7h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>NAVAL CHESS</span></div>
      <div class="status" id="status"><i class="status-punkt"></i><span id="status-text"></span></div>
    </header>

    <div class="mitte" id="mitte">
    <div class="spieler" id="spieler-oben">
      <span class="sp-flagge"></span>
      <span class="sp-name"><b></b><small></small></span>
      <span class="sp-munition"></span>
      <span class="sp-beute"></span>
      <span class="sp-denkt"><i></i><i></i><i></i></span>
    </div>

    <div class="brett-zelle" id="brett-zelle"></div>

    <div class="spieler unten" id="spieler-unten">
      <span class="sp-flagge"></span>
      <span class="sp-name"><b></b><small></small></span>
      <span class="sp-munition"></span>
      <span class="sp-beute"></span>
      <span class="sp-denkt"><i></i><i></i><i></i></span>
    </div>

    <div class="zugliste" id="zugliste"></div>
    </div>

    <nav class="aktionen" id="aktionen">
      <button class="ak" data-aktion="zurueck-zug" id="k-zurueck"><svg viewBox="0 0 24 24"><path d="M9 7L4.5 11.5 9 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11.5h9.5a5 5 0 0 1 0 10H12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Zurück</span></button>
      <button class="ak feuer" data-aktion="feuer" id="k-feuer"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 1.8v5M12 17.2v5M1.8 12h5M17.2 12h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Feuer <em id="feuer-zahl">3</em></span></button>
      <button class="ak" data-aktion="neustart"><svg viewBox="0 0 24 24"><path d="M19.5 12A7.5 7.5 0 1 1 17 6.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.8 2.8v4.4h-4.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Neustart</span></button>
      <button class="ak" data-aktion="spielmenue"><svg viewBox="0 0 24 24"><path d="M4.5 7h15M4.5 12h15M4.5 17h15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Menü</span></button>
    </nav>
  </section>

  <!-- ===================== ÜBERLAGERUNGEN ===================== -->
  <div class="blatt-huelle" id="blatt" hidden>
    <div class="blatt-grund" data-aktion="blatt-zu"></div>
    <div class="blatt-karte" id="blatt-karte"></div>
  </div>

  <div class="ende" id="ende" hidden>
    <div class="ende-karte">
      <div class="ende-bild" id="ende-bild"></div>
      <h2 class="ende-titel" id="ende-titel"></h2>
      <p class="ende-text" id="ende-text"></p>
      <button class="gross-knopf" data-aktion="nochmal">Nochmal</button>
      <div class="ende-reihe">
        <button class="flach-knopf" data-aktion="ansehen">Brett ansehen</button>
        <button class="flach-knopf" data-aktion="menue">Menü</button>
      </div>
    </div>
  </div>

  <div class="drehen" aria-hidden="true">
    <svg viewBox="0 0 64 64"><rect class="handy" x="22" y="8" width="20" height="38" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M14 52a24 24 0 0 0 36 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
